name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the bot
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Audit production dependencies
        # Transformers.js currently reports high-severity advisories in image/ZIP
        # code paths this text-only bot does not invoke. Keep CI blocking on criticals.
        run: npm audit --omit=dev --audit-level=critical

      - name: Check out the current Astra Wiki
        run: git clone --depth=1 https://github.com/Boof2015/astra.wiki.git data/wiki

      - name: Run retrieval regression suite
        env:
          WIKI_SYNC_ENABLED: "false"
          SEMANTIC_SEARCH_ENABLED: "false"
        run: npm run evaluate

      - name: Check out the current Prism Wiki
        run: git clone --depth=1 https://github.com/Boof2015/prism.wiki.git data/prism-wiki

      - name: Run Prism retrieval regression suite
        env:
          BOT_PRODUCT_NAME: Prism
          WIKI_DIRECTORY: data/prism-wiki
          WIKI_BASE_URL: https://github.com/Boof2015/prism/wiki
          WIKI_SYNC_ENABLED: "false"
          SEMANTIC_SEARCH_ENABLED: "false"
          ALIASES_FILE: config/prism-aliases.yml
          EVALUATION_PATH: test/queries-prism
          EVALUATION_MIN_TOP_ONE: "0.70"
          EVALUATION_MIN_TOP_THREE: "0.85"
          EVALUATION_MIN_PAGE_TOP_ONE: "0.80"
          EVALUATION_MIN_PAGE_TOP_THREE: "0.90"
          EVALUATION_MIN_NO_RESULT: "1"
        run: npm run evaluate
