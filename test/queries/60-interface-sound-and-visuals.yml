intents:
  - name: getting-started-install
    expected: Getting-Started#install-astra
    variants:
      - how do I install Astra
      - where can I get the music player
      - what platforms does Astra run on
      - first step for setting up Astra

  - name: getting-started-add-music
    expected: Getting-Started#add-your-music
    variants:
      - add my music to Astra
      - how do I choose a library folder
      - make Astra scan my music collection
      - I installed it but none of my songs are there

  - name: getting-started-browse
    expected: Getting-Started#browse-the-library
    variants:
      - how do I browse my library
      - find albums artists and tracks
      - where is my music collection after scanning
      - show the different library views

  - name: getting-started-play
    expected: Getting-Started#play-music
    variants:
      - how do I start playing music
      - play my first album in Astra
      - what do the basic playback controls do
      - I added songs now how do I listen

  - name: getting-started-window
    expected: Getting-Started#understand-the-main-window
    variants:
      - explain the main window
      - what are the sections of the Astra interface
      - where are library queue and settings
      - give me a tour of the app

  - name: getting-started-settings
    expected: Getting-Started#a-few-useful-first-settings
    variants:
      - which settings should I change first
      - recommended setup for a new Astra install
      - what should a beginner configure
      - useful first preferences

  - name: getting-started-updates
    expected: Getting-Started#keep-astra-updated
    variants:
      - how do I update Astra
      - check for a newer version
      - where are application updates
      - keep Astra current

  - name: enable-equalizer
    expected: Equalizer#open-and-enable-the-eq
    variants:
      - how do I enable the equalizer
      - open the EQ editor
      - turn sound adjustments on
      - where is the equalizer switch

  - name: read-equalizer-editor
    expected: Equalizer#read-the-editor
    variants:
      - explain the equalizer graph
      - what do the EQ curve and control points mean
      - how do I read the frequency response editor
      - what is shown in the EQ window

  - name: equalizer-preamp
    expected: Equalizer#preamp
    variants:
      - what does EQ preamp do
      - lower the signal before boosting bands
      - avoid clipping with the preamp
      - why should I reduce preamp after adding bass

  - name: equalizer-frequency
    expected: Equalizer#frequency
    variants:
      - what does frequency mean for an EQ band
      - choose which pitch an equalizer band affects
      - move an EQ point left or right
      - adjust bass versus treble frequency

  - name: equalizer-gain
    expected: Equalizer#gain
    variants:
      - what does gain mean on an EQ band
      - boost or cut a frequency
      - move an equalizer point up or down
      - how many decibels should an EQ band add

  - name: equalizer-q
    expected: Equalizer#q
    variants:
      - what does Q mean in the equalizer
      - make an EQ adjustment wider or narrower
      - how broad is an equalizer band
      - explain bandwidth and Q

  - name: equalizer-filter-types
    expected: Equalizer#filter-types
    variants:
      - what EQ filter types are available
      - difference between peaking shelf and pass filters
      - when should I use a low shelf
      - choose the shape of an equalizer band

  - name: equalizer-add-remove-bands
    expected: Equalizer#add-and-remove-bands
    variants:
      - add another EQ band
      - remove an equalizer control point
      - how many filters can I create
      - manage bands in the EQ editor

  - name: equalizer-built-in-presets
    expected: Equalizer#built-in-presets
    variants:
      - use a built in EQ preset
      - where are the equalizer presets
      - choose a ready made sound profile
      - apply one of Astra's included EQ curves

  - name: equalizer-custom-presets
    expected: Equalizer#save-custom-presets
    variants:
      - save my own EQ preset
      - name a custom equalizer curve
      - reuse my sound settings later
      - update a preset I made

  - name: equalizer-preset-transfer
    expected: Equalizer#import-and-export-astra-presets
    variants:
      - export an Astra EQ preset
      - import somebody else's equalizer settings
      - move an EQ curve to another computer
      - share a custom Astra preset file

  - name: equalizer-autoeq
    expected: Equalizer#import-autoeq
    variants:
      - import an AutoEQ profile
      - use headphone correction from AutoEQ
      - load parametric EQ filters from a text file
      - does Astra support AutoEQ results

  - name: equalizer-reset
    expected: Equalizer#reset
    variants:
      - reset the equalizer
      - remove all of my EQ changes
      - restore a flat sound curve
      - start the EQ over

  - name: equalizer-tuning-method
    expected: Equalizer#a-practical-tuning-method
    variants:
      - how should I tune the equalizer
      - beginner method for adjusting EQ
      - fix a harsh or boomy sound with EQ
      - make careful equalizer changes without clipping

  - name: equalizer-no-effect
    expected: Equalizer#eq-has-no-audible-effect
    variants:
      - the EQ does nothing
      - I enabled the equalizer but sound did not change
      - why can I not hear my EQ curve
      - equalizer has no audible effect

  - name: equalizer-distortion
    expected: Equalizer#audio-distorts-after-boosting
    variants:
      - audio clips after I boost the EQ
      - equalizer makes music distorted
      - bass boost causes crackling
      - my EQ settings are too loud

  - name: equalizer-autoeq-import-failure
    expected: Equalizer#an-autoeq-file-imports-too-few-or-no-bands
    variants:
      - AutoEQ imported no bands
      - some filters are missing from my AutoEQ file
      - Astra did not understand the equalizer text file
      - headphone EQ profile imports too few filters

  - name: equalizer-wrong-device-preset
    expected: Equalizer#the-wrong-preset-appears-after-changing-devices
    variants:
      - wrong EQ preset after switching outputs
      - why did my equalizer curve change with the device
      - another DAC loaded a different preset
      - EQ profile does not match the selected output

  - name: keyboard-customize-bindings
    expected: Keyboard-and-Controller-Controls#customize-keyboard-and-mouse-bindings
    variants:
      - customize keyboard shortcuts
      - change a mouse binding
      - remap Astra controls
      - where is the key binding editor

  - name: keyboard-default-bindings
    expected:
      - Keyboard-and-Controller-Controls#app
