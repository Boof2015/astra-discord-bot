x-bot-service: &bot-service
  build:
    context: .
  image: astra-wiki-bot:local
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 20s

services:
  astra:
    <<: *bot-service
    env_file:
      - ${ASTRA_ENV_FILE:-.env}
    volumes:
      - astra-data:/app/data

  prism:
    <<: *bot-service
    env_file:
      - ${PRISM_ENV_FILE:-.env.prism}
    volumes:
      - prism-data:/app/data

volumes:
  astra-data:
  prism-data:
