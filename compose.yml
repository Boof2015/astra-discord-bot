x-bot-service: &bot-service
  build:
    context: .
  image: astra-wiki-bot:local
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 20s
  environment:
    STATUS_SHARED_DIRECTORY: /app/presence

services:
  astra:
    <<: *bot-service
    env_file:
      - ${ASTRA_ENV_FILE:-.env}
    volumes:
      - astra-data:/app/data
      - status-presence:/app/presence

  prism:
    <<: *bot-service
    env_file:
      - ${PRISM_ENV_FILE:-.env.prism}
    volumes:
      - prism-data:/app/data
      - status-presence:/app/presence

volumes:
  astra-data:
  prism-data:
  status-presence:
